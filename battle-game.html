<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>対戦中</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container quiz-page">
        <h1>鳴き声クイズ</h1>
        <p id="quizMessage">相手と同じポケモンを当てて勝負します。</p>
        <p id="roomConnectionStatus" class="room-status-message" aria-live="polite"></p>
        <p id="battleScore" class="battle-score" aria-live="polite">あなた 0 - 0 相手</p>

        <div id="quizPokemonImage" class="quiz-pokemon-image" aria-label="ポケモンの画像">
            <span aria-hidden="true">?</span>
        </div>

        <button id="quizStartButton" hidden>クイズ開始</button>
        <div class="replay-cry-wrapper">
            <button id="replayCryButton" type="button" aria-label="鳴き声をもう一度再生" title="鳴き声をもう一度再生">
                <img src="volume_up_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.png" alt="">
            </button>
        </div>

        <div id="quizAnswerArea">
            <label for="quizAnswer">このポケモンの名前は？</label>
            <div class="answer-input-wrapper">
                <input id="quizAnswer" name="pokemon-answer" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="日本語名を入力">
                <div id="pokemonSuggestions" class="pokemon-suggestions" role="listbox" hidden></div>
            </div>
            <button id="quizCheckButton" class="check-answer-button">答え合わせ</button>
        </div>

        <section id="battleHints" class="battle-hints" aria-live="polite">
            <h2>ヒント</h2>
            <p id="battleHint1" hidden></p>
            <p id="battleHint2" hidden></p>
            <p id="battleHint3" hidden></p>
        </section>

        <div id="battleResultPanel" class="battle-result-panel" hidden>
            <h3>対戦結果</h3>
            <p id="battleResultText"></p>
            <p id="nextRoundCountdown" class="next-round-countdown" hidden></p>
        </div>

        <div id="waitingPopup" class="waiting-popup" role="status" aria-live="polite" hidden>
            相手を待っています…
        </div>

        <div id="matchResultPopup" class="match-result-popup" role="alert" aria-live="assertive" hidden>
            <strong id="matchResultPopupText"></strong>
        </div>

        <a class="back-link" href="index.html">トップページに戻る</a>
    </main>

    <script type="module" src="battle-game.js"></script>
</body>

</html>
